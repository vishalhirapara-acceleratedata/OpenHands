# Studio-owned DuckDB-local dbt profile (VD-3815). Both database locations are
# deployment-specific absolute paths delivered by the Runtime Location Contract
# env — never a literal path, never a workspace-relative file. The domain
# database attaches read-only in dev under the stable alias `domain`: the
# ephemeral and domain files often share a stem (both named after the domain
# slug), so an alias-less attach would collide with the primary catalog.
# Reference domain relations as domain.<schema>.<table>.
dbt_duckdb_local:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: "{{ env_var('VD_EPHM_DUCKDB_PATH') }}"
      schema: "{{ env_var('VD_EPHM_SCHEMA') }}"
      attach:
        - path: "{{ env_var('VD_DOMAIN_DUCKDB_PATH') }}"
          alias: domain
          read_only: true
      threads: 4

    prod:
      type: duckdb
      path: "{{ env_var('VD_DOMAIN_DUCKDB_PATH') }}"
      schema: "{{ env_var('VD_DOMAIN_SCHEMA') }}"
      threads: 4
